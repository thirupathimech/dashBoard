<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <link rel="icon" href="favicon.ico">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* Animated Background */
        .bg-animation span {
            position: absolute;
            display: block;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            animation: float 25s linear infinite;
            bottom: -150px;
            border-radius: 50%;
            backdrop-filter: blur(5px);
        }

        .bg-animation span:nth-child(1) {
            left: 10%;
            width: 80px;
            height: 80px;
            animation-delay: 0s;
        }

        .bg-animation span:nth-child(2) {
            left: 25%;
            width: 40px;
            height: 40px;
            animation-delay: 2s;
            animation-duration: 12s;
        }

        .bg-animation span:nth-child(3) {
            left: 70%;
            width: 100px;
            height: 100px;
            animation-delay: 4s;
        }

        .bg-animation span:nth-child(4) {
            left: 50%;
            width: 60px;
            height: 60px;
            animation-delay: 0s;
            animation-duration: 18s;
        }

        .bg-animation span:nth-child(5) {
            left: 85%;
            width: 30px;
            height: 30px;
            animation-delay: 1s;
            animation-duration: 10s;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            100% {
                transform: translateY(-1200px) rotate(720deg);
                opacity: 0;
            }
        }

        .glass-card {
            width: 95%;
            max-width: 450px;
            padding: 40px 25px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            z-index: 10;
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            from {
                box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            }

            to {
                box-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            }
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            margin-bottom: 25px;
        }

        .countdown {
            font-size: 4rem;
            font-weight: bold;
            color: #00f7ff;
            text-shadow: 0 0 20px #00f7ff;
            margin-bottom: 20px;
        }

        .progress {
            height: 12px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .progress-bar {
            width: 100%;
            animation: progressAnim 5s linear forwards;
            background: linear-gradient(90deg, #00f7ff, #00ff88);
            border-radius: 50px;
        }

        @keyframes progressAnim {
            from {
                width: 100%;
            }

            to {
                width: 0%;
            }
        }

        .footer-text {
            margin-top: 20px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }

        @media (max-width: 576px) {
            h1 {
                font-size: 1.6rem;
            }

            .countdown {
                font-size: 3rem;
            }

            .glass-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Background Animation -->
    <div class="bg-animation">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Main Card -->
    <div class="glass-card animate__animated animate__zoomIn">

        <div class="logo">🚀</div>

        <h1 class="animate__animated animate__fadeInDown">
            Welcome Boss!
        </h1>

        <p class="animate__animated animate__fadeInUp">
            Dashboard loading... Please wait
        </p>

        <div id="count" class="countdown">5</div>

        <div class="progress">
            <div class="progress-bar"></div>
        </div>

        <div class="footer-text">
            Redirecting securely...
        </div>

    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        let timeLeft = 5;

        const countdown = setInterval(() => {
            timeLeft--;
            $("#count").text(timeLeft);

            if (timeLeft <= 0) {
                clearInterval(countdown);

                $("body").fadeOut(800, function() {
                    window.location.href =
                        "https://thirupathimech.github.io/dashBoard";
                });
            }
        }, 1000);
    </script>

</body>

</html>
