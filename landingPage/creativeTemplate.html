        if(d.layout==='volt-lane')return '<article class="ev-card"><div class="item-image"><img src="'+image+'" alt="'+title+'" loading="lazy"></div><div class="ev-copy"><span class="item-meta">'+tag+' · BATTERY REPORT</span><h3 class="item-title">'+title+'</h3><p class="item-desc">'+desc+'</p><div class="ev-range"><span>EST. RANGE</span><strong>'+html(item.range||'See report')+'</strong></div><p><strong>'+price+'</strong></p>'+action('Request battery report','enquire',index)+'</div></article>';
        if(d.layout==='heritage-motors')return '<article class="classic-card"><div class="item-image"><img src="'+image+'" alt="'+title+'" loading="lazy"></div><div class="classic-copy"><span class="classic-year">'+tag+'</span><h3 class="item-title">'+title+'</h3><p class="item-desc">'+desc+'</p><strong>'+price+'</strong><br>'+action('Request provenance','enquire',index)+'</div></article>';
        return '<article class="vehicle-card"><div class="item-image"><img src="'+image+'" alt="'+title+'" loading="lazy"></div><div class="vehicle-copy"><span class="item-meta">'+tag+' · VERIFIED LISTING</span><h3 class="item-title">'+title+'</h3><div class="vehicle-specs">'+desc.split(' · ').map(x=>'<span>'+html(x)+'</span>').join('')+'</div><p><strong class="vehicle-price">'+price+'</strong></p>'+action('Request vehicle details','enquire',index)+'</div></article>';
      }
      function renderItems(){const list=products.map((p,i)=>({item:p,index:i})).filter(x=>x.item.group===data.group&&(activeFilter==='All'||x.item.tag===activeFilter));document.getElementById('items').innerHTML=list.map(x=>itemCard(x.item,x.index,data)).join('')}
      const work=d=>'<section class="section work work--'+d.layout+'" id="work"><div class="work-head"><span class="eyebrow">'+html(d.stamp)+'</span><h2 class="section-title">'+html(d.work)+'</h2><p class="section-copy">'+html(d.workIntro)+'</p></div>'+filtersMarkup(d)+'<div class="items items--'+d.layout+'" id="items"></div></section>';
      const contact=d=>'<section class="section contact contact--'+d.layout+'" id="contact"><div class="contact-copy"><span class="eyebrow">THE NEXT STEP</span><h2>'+html(d.about)+'</h2><p>'+html(d.aboutText)+'</p><p class="contact-note">This preview opens WhatsApp with your message ready. Choose a contact to send it.</p></div><form class="contact-form" id="contactForm"><input name="name" placeholder="Your name" autocomplete="name" required><input name="email" type="email" placeholder="Email address" autocomplete="email" required><select name="service" id="serviceField" aria-label="Choose a service"><option value="">Choose a service</option>'+d.services.map(s=>'<option>'+html(s)+'</option>').join('')+'</select><input name="date" type="date" aria-label="Preferred date"><textarea name="message" id="messageField" placeholder="Tell us a little about what you need"></textarea><button class="button" type="submit">Send an enquiry ↗</button></form></section>';
      const footer=d=>'<footer class="site-footer wrap"><span>© '+new Date().getFullYear()+' '+html(d.brand)+' · Crafted with care</span><span>Distinct template preview · <a href="../landingPageShowcase.html">Back to all designs</a></span></footer>';
      const stats=d=>'<section class="section viewpoint-stats"><div class="stat-row"><div class="stat"><strong>'+html(d.stat1)+'</strong><span>'+html(d.stat1Label)+'</span></div><div class="stat"><strong>'+html(d.stat2)+'</strong><span>'+html(d.stat2Label)+'</span></div></div></section>';
      const story=d=>'<section class="section story-split" id="about"><div><span class="eyebrow">A NOTE FROM THE STUDIO</span><h2>'+html(d.about)+'</h2><p>'+html(d.aboutText)+'</p><a class="item-action" href="#contact">Continue the conversation ↗</a></div><div class="story-image"><img src="'+html(d.hero)+'" alt="'+html(d.name)+' studio story" loading="lazy"></div></section>';
      const band=(text,cls)=>'<section class="story-band '+(cls||'')+'"><p>'+html(text)+'</p></section>';
      const hero=(d,extraClass)=>'<section class="hero hero--'+extraClass+'" id="top">'+heroImg(d)+heroCopy(d)+'</section>';
      const renderers={
        'shutter-pro':d=>'<div class="page design-'+d.layout+'">'+nav(d)+'<main class="wrap">'+hero(d,'shutter')+story(d)+work(d)+contact(d)+'</main>'+footer(d)+'</div>',
        'viewpoint':d=>'<div class="page design-'+d.layout+'">'+nav(d)+'<main>'+hero(d,'viewpoint')+'<div class="wrap">'+stats(d)+work(d)+story(d)+contact(d)+'</div></main>'+footer(d)+'</div>',
        'studio-frame':d=>'<div class="page design-'+d.layout+'">'+nav(d)+'<main class="wrap">'+hero(d,'studio')+band('IDEA → DIRECTION → IMAGE → DELIVERY','client-band')+work(d)+story(d)+contact(d)+'</main>'+footer(d)+'</div>',
        'royal-drapes':d=>'<div class="page design-'+d.layout+'">'+nav(d)+'<main class="wrap">'+hero(d,'royal')+band('A legacy in every thread. A memory in every drape.','silk-quote')+work(d)+story(d)+contact(d)+'</main>'+footer(d)+'</div>',
        'handloom-heritage':d=>'<div class="page design-'+d.layout+'">'+nav(d)+'<main class="wrap">'+hero(d,'handloom')+story(d)+work(d)+stats(d)+contact(d)+'</main>'+footer(d)+'</div>',
        'festive-glam':d=>'<div class="page design-'+d.layout+'">'+nav(d)+'<main class="wrap">'+hero(d,'festive')+band('COLOUR THAT ARRIVES BEFORE YOU DO','glam-band')+work(d)+contact(d)+story(d)+'</main>'+footer(d)+'</div>',
        'modern-drapes':d=>'<div class="page design-'+d.layout+'">'+nav(d)+'<main class="wrap">'+hero(d,'modern')+work(d)+story(d)+contact(d)+'</main>'+footer(d)+'</div>',
        'bridal-bliss':d=>'<div class="page design-'+d.layout+'">'+nav(d)+'<main class="wrap">'+hero(d,'bridal')+band('A keepsake of the day you begin forever.','bridal-band')+work(d)+stats(d)+story(d)+contact(d)+'</main>'+footer(d)+'</div>',
        'arabic-flair':d=>'<div class="page design-'+d.layout+'">'+nav(d)+'<main class="wrap">'+hero(d,'arabic')+work(d)+band('Open space. Confident lines. Your own story.','arabic-band')+story(d)+contact(d)+'</main>'+footer(d)+'</div>',
        'party-magic':d=>'<div class="page design-'+d.layout+'">'+nav(d)+'<main class="wrap">'+hero(d,'party')+stats(d)+work(d)+band('Pick your favourites. We bring the artist corner.','party-band')+story(d)+contact(d)+'</main>'+footer(d)+'</div>',
        'heritage-patterns':d=>'<div class="page design-'+d.layout+'">'+nav(d)+'<main class="wrap">'+hero(d,'heritage')+story(d)+work(d)+band('A living archive, carried forward by hand.','archive-band')+contact(d)+'</main>'+footer(d)+'</div>',
        'elite-wheels':d=>'<div class="page design-'+d.layout+'">'+nav(d)+'<main>'+hero(d,'elite')+'<div class="wrap"><section class="section vehicle-stats"><div class="stat-row"><div class="stat"><strong>'+html(d.stat1)+'</strong><span>'+html(d.stat1Label)+'</span></div><div class="stat"><strong>'+html(d.stat2)+'</strong><span>'+html(d.stat2Label)+'</span></div></div></section>'+work(d)+story(d)+contact(d)+'</div></main>'+footer(d)+'</div>',
        'prime-drive':d=>'<div class="page design-'+d.layout+'">'+nav(d)+'<main class="wrap">'+hero(d,'prime')+'<div class="prime-trust"><span>✓ OWNERSHIP CHECK</span><span>✓ SERVICE HISTORY</span><span>✓ INSPECTION REPORT</span></div>'+work(d)+story(d)+contact(d)+'</main>'+footer(d)+'</div>',
        'torque-haus':d=>'<div class="page design-'+d.layout+'">'+nav(d)+hero(d,'torque')+'<div class="torque-strip">POWER · PROVENANCE · PERSONAL VIEWING</div><main class="wrap">'+work(d)+story(d)+contact(d)+'</main>'+footer(d)+'</div>',
        'cityloop-motors':d=>'<div class="page design-'+d.layout+'">'+nav(d)+'<main class="wrap">'+hero(d,'city')+'<div class="city-budget"><strong>Clear price, no surprises</strong><span>Compare your options and ask for a sample EMI estimate.</span></div>'+work(d)+story(d)+contact(d)+'</main>'+footer(d)+'</div>',
        'volt-lane':d=>'<div class="page design-'+d.layout+'">'+nav(d)+'<main class="wrap">'+hero(d,'volt')+'<div class="ev-band"><span>Battery health</span><span>Real-world range</span><span>Charging support</span></div>'+work(d)+story(d)+contact(d)+'</main>'+footer(d)+'</div>',
        'heritage-motors':d=>'<div class="page design-'+d.layout+'">'+nav(d)+'<main class="wrap">'+hero(d,'heritage-motors')+band('Preserved with care. Documented for the next custodian.','classic-band')+story(d)+work(d)+contact(d)+'</main>'+footer(d)+'</div>'
      };
      document.getElementById('app').innerHTML=renderers[data.layout](data);
      renderItems();
      const app=document.getElementById('app');
      app.addEventListener('click',event=>{
        const filter=event.target.closest('[data-filter]');
        if(filter){activeFilter=filter.dataset.filter;document.querySelectorAll('.filter').forEach(button=>button.classList.toggle('active',button===filter));renderItems();return}
        const button=event.target.closest('[data-action]');
        if(!button)return;
        const item=products[Number(button.dataset.index)];
        if(!item)return;
        if(button.dataset.action==='view'){document.getElementById('lightboxImage').src=item.image;document.getElementById('lightboxImage').alt=item.title;document.getElementById('lightbox').classList.add('open');return}
        if(button.dataset.action==='add'&&data.group==='shop'){bag.push(item.title);const count=document.getElementById('bagCount');if(count)count.textContent=String(bag.length);document.getElementById('messageField').value='I am interested in: '+bag.join(', ');toast(item.title+' added to your enquiry bag');return}
        const service=document.getElementById('serviceField');service.value=isCarTemplate(data.layout)&&data.services[1]?data.services[1]:data.services[0];
        document.getElementById('messageField').value=(isCarTemplate(data.layout)?'Please share details about ':'I would like to book ')+item.title+'.';
        document.getElementById('contact').scrollIntoView({behavior:'smooth'});toast(item.title+' selected');
      });
      document.getElementById('app').addEventListener('submit',event=>{
        if(event.target.id!=='contactForm')return;
        event.preventDefault();if(!event.target.reportValidity())return;
        const form=new FormData(event.target);
        const message=['Hello, I am '+form.get('name')+'.','My email is '+form.get('email')+'.',form.get('service')?'I am interested in '+form.get('service')+'.':'',form.get('date')?'Preferred date: '+form.get('date')+'.':'',form.get('message')?'Message: '+form.get('message'):''].filter(Boolean).join(' ');
        window.open('https://wa.me/?text='+encodeURIComponent(message),'_blank');toast('Your WhatsApp message is ready to send');
      });
      document.getElementById('closeLightbox').addEventListener('click',closeLightbox);
      document.getElementById('lightbox').addEventListener('click',event=>{if(event.target.id==='lightbox')closeLightbox()});
      document.addEventListener('keydown',event=>{if(event.key==='Escape')closeLightbox()});
      const bagButton=document.getElementById('bagButton');if(bagButton)bagButton.addEventListener('click',()=>document.getElementById('contact').scrollIntoView({behavior:'smooth'}));
      function closeLightbox(){document.getElementById('lightbox').classList.remove('open')}
      function toast(message){const element=document.getElementById('toast');element.textContent=message;element.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>element.classList.remove('show'),2300)}
    })();
  </script>
</body>
</html>
